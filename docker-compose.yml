services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cigt-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPassword@123"
    ports:
      - "1433:1433"
    volumes:
      - cigt-sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  cigt-sql-data:
